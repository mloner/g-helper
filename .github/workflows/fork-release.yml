name: Fork release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository != 'seerge/g-helper'
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Publish
      run: |
        dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained

    - name: Package
      run: |
        $exe = 'app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe'
        Copy-Item $exe ./GHelper.exe
        Compress-Archive ./GHelper.exe ./GHelper.zip
        "$((Get-FileHash ./GHelper.exe -Algorithm SHA256).Hash)  GHelper.exe" | Out-File ./SHA256SUMS.txt -Encoding ascii

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v7
      with:
        name: GHelper
        path: |
          ./GHelper.exe
          ./SHA256SUMS.txt

    - name: Upload to release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" ./GHelper.exe ./GHelper.zip ./SHA256SUMS.txt --clobber
